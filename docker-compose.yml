services:
  postgres:
    image: postgres:16
    container_name: ptof_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ptof_dev
    ports:
      - "5432:5432"
    volumes:
      - ptof_postgres_data:/var/lib/postgresql/data

volumes:
  ptof_postgres_data: